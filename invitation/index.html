<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>邀请函 · 2026 小候鸟亲子工厂开放日</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sky-top: #8ec8f0;
      --sky-mid: #c8e7f8;
      --sky-soft: #e8f6fc;
      --ground: #fff6d8;
      --green: #3cb371;
      --green-deep: #2f9e5f;
      --orange: #f28c28;
      --orange-deep: #e86a1a;
      --red: #e85a4f;
      --yellow: #ffd84d;
      --ink: #2a3a4a;
      --muted: #5a6d7e;
      --white: #ffffff;
      --firstack: #1a3a6b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: "Noto Serif SC", "Songti SC", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.55) 0 12%, transparent 13%),
        radial-gradient(circle at 78% 18%, rgba(255, 216, 77, 0.35) 0 3%, transparent 4%),
        linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 38%, var(--sky-soft) 62%, var(--ground) 100%);
      overflow-x: hidden;
    }

    .scene {
      position: relative;
      width: min(100%, 720px);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(1.25rem, 4vw, 2.5rem) clamp(1.1rem, 4vw, 2rem) 2.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      isolation: isolate;
    }

    .decor {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bunting {
      position: absolute;
      top: 0.4rem;
      width: 42%;
      height: auto;
      opacity: 0.95;
      transform-origin: top center;
      animation: sway 4.8s ease-in-out infinite;
    }

    .bunting.left { left: -2%; }
    .bunting.right {
      right: -2%;
      transform: scaleX(-1);
      animation-name: sway-flip;
      animation-delay: 0.6s;
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.82);
      border-radius: 999px;
      animation: drift 12s ease-in-out infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: inherit;
    }

    .cloud-a {
      width: 78px;
      height: 28px;
      top: 9%;
      left: 8%;
      animation-duration: 14s;
    }
    .cloud-a::before { width: 36px; height: 36px; left: 10px; top: -18px; }
    .cloud-a::after { width: 44px; height: 44px; left: 30px; top: -22px; }

    .cloud-b {
      width: 96px;
      height: 32px;
      top: 14%;
      right: 6%;
      animation-duration: 16s;
      animation-delay: -3s;
    }
    .cloud-b::before { width: 42px; height: 42px; left: 14px; top: -20px; }
    .cloud-b::after { width: 50px; height: 50px; left: 38px; top: -26px; }

    .star {
      position: absolute;
      color: var(--yellow);
      font-size: 1rem;
      animation: twinkle 2.8s ease-in-out infinite;
      text-shadow: 0 0 8px rgba(255, 216, 77, 0.55);
    }
    .star.s1 { top: 22%; left: 14%; animation-delay: 0.2s; }
    .star.s2 { top: 28%; right: 16%; animation-delay: 1s; font-size: 0.8rem; }
    .star.s3 { top: 18%; left: 48%; animation-delay: 1.6s; font-size: 0.7rem; }

    .bird {
      position: absolute;
      width: 28px;
      height: 18px;
      animation: fly 7s ease-in-out infinite;
    }
    .bird.b1 { top: 20%; right: 28%; }
    .bird.b2 { top: 26%; right: 20%; width: 22px; animation-delay: 1.2s; }

    .gear {
      position: absolute;
      opacity: 0.85;
      animation: spin 18s linear infinite;
    }
    .gear.g1 { width: 42px; top: 34%; left: 6%; color: var(--orange); animation-duration: 22s; }
    .gear.g2 { width: 34px; top: 40%; right: 7%; color: #4aa3e0; animation-direction: reverse; animation-duration: 16s; }

    .invite {
      position: relative;
      z-index: 1;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(0.85rem, 2.5vw, 1.35rem);
      padding-top: 0.5rem;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
    }

    .brand-mark {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }

    .brand-name {
      font-family: "ZCOOL KuaiLe", "PingFang SC", sans-serif;
      font-size: clamp(1.55rem, 5.2vw, 2.15rem);
      letter-spacing: 0.04em;
      line-height: 1.1;
      color: var(--orange-deep);
      background-image: linear-gradient(90deg, var(--red) 0%, var(--orange) 100%);
      -webkit-background-clip: text;
      background-clip: text;
    }

    @supports (-webkit-background-clip: text) or (background-clip: text) {
      .brand-name {
        color: transparent;
        -webkit-text-fill-color: transparent;
      }
    }

    .eyebrow {
      font-family: "ZCOOL QingKe HuangYou", "PingFang SC", sans-serif;
      font-size: clamp(0.95rem, 2.8vw, 1.1rem);
      color: var(--muted);
      letter-spacing: 0.28em;
    }

    .title {
      font-family: "ZCOOL KuaiLe", "PingFang SC", sans-serif;
      font-size: clamp(1.85rem, 7vw, 2.75rem);
      line-height: 1.25;
      letter-spacing: 0.02em;
      max-width: 14ch;
    }

    .title .part-a {
      color: var(--green-deep);
      text-shadow:
        -2px -2px 0 var(--white),
         2px -2px 0 var(--white),
        -2px  2px 0 var(--white),
         2px  2px 0 var(--white),
         0 3px 0 rgba(255, 255, 255, 0.9);
    }

    .title .part-b {
      color: var(--orange-deep);
      text-shadow:
        -2px -2px 0 var(--white),
         2px -2px 0 var(--white),
        -2px  2px 0 var(--white),
         2px  2px 0 var(--white),
         0 3px 0 rgba(255, 255, 255, 0.9);
    }

    .slogan {
      font-family: "ZCOOL QingKe HuangYou", "PingFang SC", sans-serif;
      font-size: clamp(1rem, 3.2vw, 1.25rem);
      color: var(--muted);
      letter-spacing: 0.12em;
    }

    .lead {
      max-width: 28ch;
      font-size: clamp(1rem, 3vw, 1.15rem);
      line-height: 1.75;
      color: var(--ink);
    }

    .time-block {
      margin-top: 0.35rem;
    }

    .time-label {
      display: block;
      font-family: "ZCOOL QingKe HuangYou", "PingFang SC", sans-serif;
      font-size: 0.95rem;
      letter-spacing: 0.35em;
      color: var(--green-deep);
      margin-bottom: 0.35rem;
    }

    .time-value {
      display: inline-block;
      font-family: "ZCOOL KuaiLe", "PingFang SC", sans-serif;
      font-size: clamp(2rem, 8vw, 2.8rem);
      color: var(--orange-deep);
      letter-spacing: 0.04em;
      line-height: 1;
      position: relative;
    }

    .time-value::after {
      content: "";
      display: block;
      height: 8px;
      margin-top: 0.35rem;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, var(--yellow), var(--orange), transparent);
      opacity: 0.8;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-top: 0.25rem;
    }

    .cta {
      appearance: none;
      border: none;
      cursor: pointer;
      font-family: "ZCOOL QingKe HuangYou", "PingFang SC", sans-serif;
      font-size: 1.05rem;
      letter-spacing: 0.12em;
      padding: 0.85rem 1.5rem;
      border-radius: 999px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
    }

    .cta.primary {
      background: linear-gradient(135deg, var(--green) 0%, var(--green-deep) 100%);
      color: var(--white);
      box-shadow: 0 10px 24px rgba(47, 158, 95, 0.28);
    }

    .cta.secondary {
      background: rgba(255, 255, 255, 0.7);
      color: var(--firstack);
      border: 2px solid rgba(26, 58, 107, 0.18);
    }

    .cta:hover { transform: translateY(-2px); }
    .cta:active { transform: translateY(0); }

    .hero-art {
      width: min(100%, 420px);
      margin-top: clamp(0.5rem, 3vw, 1.25rem);
      animation: bob 4.5s ease-in-out infinite;
    }

    .footer-brand {
      margin-top: auto;
      padding-top: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      z-index: 1;
    }

    .firstack {
      font-family: "ZCOOL QingKe HuangYou", "PingFang SC", sans-serif;
      font-size: 1.35rem;
      letter-spacing: 0.18em;
      color: var(--firstack);
      font-weight: 700;
    }

    .firstack .a {
      position: relative;
      display: inline-block;
    }

    .firstack .a::after {
      content: "";
      position: absolute;
      top: 0.18em;
      left: 50%;
      width: 0;
      height: 0;
      border-left: 0.28em solid transparent;
      border-right: 0.28em solid transparent;
      border-bottom: 0.32em solid var(--red);
      transform: translateX(-50%);
    }

    .footer-note {
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-1.5deg); }
      50% { transform: rotate(1.8deg); }
    }

    @keyframes sway-flip {
      0%, 100% { transform: scaleX(-1) rotate(-1.5deg); }
      50% { transform: scaleX(-1) rotate(1.8deg); }
    }

    @keyframes drift {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(18px); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    @keyframes fly {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-12px, -10px); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @media (max-width: 480px) {
      .brand-mark { width: 44px; height: 44px; }
      .gear.g1 { width: 34px; left: 3%; }
      .gear.g2 { width: 28px; right: 3%; }
      .cta { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .bunting, .cloud, .star, .bird, .gear, .hero-art {
        animation: none !important;
      }
    }

    @media print {
      body { background: var(--sky-soft); }
      .cta-row { display: none; }
      .scene { min-height: auto; }
      .bunting, .cloud, .star, .bird, .gear, .hero-art { animation: none !important; }
    }
  </style>
</head>

  <main class="scene">
    <div class="decor" aria-hidden="true">
      <svg class="bunting left" viewBox="0 0 220 70" fill="none">

      </svg>
    </div>

    <section class="invite">
      <div class="brand-row">
        <svg class="brand-mark" viewBox="0 0 80 80" aria-hidden="true">
          <defs>
            <linearGradient id="handGrad" x1="0" y1="0" x2="1" y2="1">

        <h1 class="brand-name">暑期爱心托班</h1>
      </div>

        <span class="part-a">2026 小候鸟</span><br />

      <p class="lead">

      <p class="footer-note">温暖同行 · 爱心相伴</p>

  </main>

</html>
